name: sonde
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3 python-jobspy || true
      - name: sonde
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
        run: python scripts/plus.py
