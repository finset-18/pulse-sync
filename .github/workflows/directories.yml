name: directories

on:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directories
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: check
        env:
          R: ${{ secrets.DATA_REPO }}
          T: ${{ secrets.DATA_TOKEN }}
        run: '[ -n "$R" ] && [ -n "$T" ] || { echo "missing DATA_REPO / DATA_TOKEN secrets"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3
      - name: run
        env:
          DATA_DIR: ${{ github.workspace }}/store/data
          QUIET: "1"
        run: python scripts/annuaires.py > run.log 2>&1; s=$?; tail -n 1 run.log | cut -c1-200; exit $s
      - name: save
        working-directory: store
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/annuaire.json data/hors_liste.json
          git diff --cached --quiet && exit 0
          git commit -q -m "directories $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
