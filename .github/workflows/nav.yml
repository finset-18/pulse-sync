name: nav

# Lecture au navigateur des fiches eFinancialCareers, Welcome to the Jungle et Indeed sans date écrite (et du lien officiel de l'employeur).
# Il ne touche pas aux offres : il écrit data/dates_nav.json, que le job sync reprend à son passage suivant.
on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: check
        env:
          R: ${{ secrets.DATA_REPO }}
          T: ${{ secrets.DATA_TOKEN }}
        run: '[ -n "$R" ] && [ -n "$T" ] || { echo "missing DATA_REPO / DATA_TOKEN secrets"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.48.0
      - run: pip install -q requests==2.32.3 playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: lecture
        env:
          DATA_DIR: ${{ github.workspace }}/store/data
          NAV_BUDGET_S: "2700"
          NAV_CONC: "4"
        run: |
          s=0; python scripts/nav.py > run.log 2>&1 || s=$?
          grep '^nav' run.log | tail -n 3 | cut -c1-300 || true
          # en cas d'erreur : seulement les lignes de la trace Python (jamais le texte des offres)
          [ $s -eq 0 ] || grep -E '^(Traceback|  File |[A-Za-z]+(Error|Exception))' run.log | tail -n 12 | cut -c1-200
          exit $s
      - name: save
        if: always()
        working-directory: store
        run: |
          [ -f data/dates_nav.json ] || exit 0
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/dates_nav.json
          git diff --cached --quiet && exit 0
          git commit -q -m "nav $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5 6; do git pull -q --rebase --autostash -X theirs && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
